<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>韩国女团随机抽取器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            color: #fff;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px;
            max-width: 600px;
            width: 90%;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1rem;
            opacity: 0.85;
            margin-bottom: 40px;
        }

        .display-area {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 30px;
            margin-bottom: 30px;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.25);
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }

        .display-area:hover { transform: scale(1.02); }

        .label {
            font-size: 1rem;
            opacity: 0.8;
            margin-bottom: 10px;
        }

        .result {
            font-size: 2.8rem;
            font-weight: bold;
            text-shadow: 1px 1px 6px rgba(0,0,0,0.3);
            animation: fadeInUp 0.5s ease;
        }

        .result-sub {
            font-size: 1.1rem;
            opacity: 0.75;
            margin-top: 8px;
        }

        .hint {
            font-size: 0.95rem;
            opacity: 0.7;
            color: #ffe0f0;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        .spinning .result {
            animation: spin 0.1s linear infinite;
        }

        .btn {
            padding: 16px 50px;
            font-size: 1.3rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            background: linear-gradient(135deg, #ff6b9d, #c44dff);
            color: #fff;
            font-weight: bold;
            box-shadow: 0 6px 25px rgba(196, 77, 255, 0.5);
            transition: all 0.3s;
            letter-spacing: 2px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 35px rgba(196, 77, 255, 0.7);
        }

        .btn:active { transform: translateY(0); }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .reset-btn {
            margin-top: 15px;
            padding: 10px 30px;
            font-size: 0.95rem;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 30px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            display: none;
        }

        .reset-btn:hover { background: rgba(255,255,255,0.35); }

        .step-indicator {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .step {
            width: 12px; height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transition: all 0.3s;
        }

        .step.active { background: #fff; transform: scale(1.3); }
        .step.done { background: #ff6b9d; }

        .confetti {
            position: fixed;
            top: -10px;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            animation: fall linear forwards;
            pointer-events: none;
            z-index: 999;
        }

        @keyframes fall {
            to { top: 110vh; transform: rotate(720deg); }
        }
    </style>
</head>
<body>

    let state = 'idle'; // idle -> groupPicked -> memberPicked
    let selectedGroup = null;
    let selectedMembers = null;

    const displayArea = document.getElementById('displayArea');
    const hintText = document.getElementById('hintText');
    const mainBtn = document.getElementById('mainBtn');
    const resetBtn = document.getElementById('resetBtn');
    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');

    function handleClick() {
        if (state === 'idle') {
            pickGroup();
        } else if (state === 'groupPicked') {
            pickMember();
        }
    }

    function pickGroup() {
        mainBtn.disabled = true;
        const groupNames = Object.keys(groups);
        let count = 0;
        const totalSpins = 20;
        displayArea.classList.add('spinning');

        const interval = setInterval(() => {
            const rand = groupNames[Math.floor(Math.random() * groupNames.length)];
            displayArea.innerHTML = `<div class="result">${rand}</div>`;
            count++;
            if (count >= totalSpins) {
                clearInterval(interval);
                displayArea.classList.remove('spinning');
                selectedGroup = groupNames[Math.floor(Math.random() * groupNames.length)];
                selectedMembers = groups[selectedGroup];
                displayArea.innerHTML = `
                    <div class="label">女团</div>
                    <div class="result">${selectedGroup}</div>
                    <div class="result-sub">共 ${selectedMembers.length} 名成员</div>
                `;
                state = 'groupPicked';
                mainBtn.textContent = '抽取成员';
                mainBtn.disabled = false;
                step1.classList.remove('active');
                step1.classList.add('done');
                step2.classList.add('active');
            }
        }, 80);
    }

    function pickMember() {
        mainBtn.disabled = true;
        let count = 0;
        const totalSpins = 20;
        displayArea.classList.add('spinning');

        const interval = setInterval(() => {
            const rand = selectedMembers[Math.floor(Math.random() * selectedMembers.length)];
            displayArea.innerHTML = `
                <div class="label">${selectedGroup}</div>
                <div class="result">${rand}</div>
            `;
            count++;
            if (count >= totalSpins) {
                clearInterval(interval);
                displayArea.classList.remove('spinning');
                const member = selectedMembers[Math.floor(Math.random() * selectedMembers.length)];
                displayArea.innerHTML = `
                    <div class="label">${selectedGroup}</div>
                    <div class="result">${member}</div>
                    <div class="result-sub">恭喜你抽到了！</div>
                `;
                state = 'memberPicked';
                mainBtn.style.display = 'none';
                resetBtn.style.display = 'inline-block';
                step2.classList.remove('active');
                step2.classList.add('done');
                launchConfetti();
            }
        }, 80);
    }

    function resetAll() {
        state = 'idle';
        selectedGroup = null;
        selectedMembers = null;
        displayArea.innerHTML = '<p class="hint" id="hintText">点击下方按钮开始抽取女团</p>';
        mainBtn.textContent = '抽 取';
        mainBtn.style.display = 'inline-block';
        mainBtn.disabled = false;
        resetBtn.style.display = 'none';
        step1.className = 'step active';
        step2.className = 'step';
    }

    function launchConfetti() {
        const colors = ['#ff6b9d', '#c44dff', '#ffdd57', '#48dbfb', '#ff9ff3', '#54a0ff', '#5f27cd', '#01a3a4'];
        for (let i = 0; i < 60; i++) {
            const el = document.createElement('div');
            el.className = 'confetti';
            el.style.left = Math.random() * 100 + 'vw';
            el.style.background = colors[Math.floor(Math.random() * colors.length)];
            el.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
            el.style.animationDelay = Math.random() * 0.5 + 's';
            el.style.width = (Math.random() * 8 + 6) + 'px';
            el.style.height = (Math.random() * 8 + 6) + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 4000);
        }
    }
